<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>一键安排</title>
  <link rel="stylesheet" href="../module.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>一键安排</h1>
  <p class="note">安排期间请勿手动调动居民或编辑房间。房间规划等待确认时，关闭面板不会执行，重开后可确认或取消；已确认的任务关闭面板后仍会继续。</p>
  <details>
    <summary>房间整理排序（点击展开调整）<button class="help-button" type="button" aria-label="房间排序调整说明" title="按住右侧三横线手柄上下拖动调整，从上到下、从左到右按此顺序整理；同类房间仍优先高等级。排序自动保存在本扩展中。">?</button></summary>
    <ol id="room-order"></ol>
  </details>
  <div class="actions">
    <div class="action-with-help"><button id="start" disabled>一键安排居民</button><button class="help-button" type="button" aria-label="居民安排规则" title="宿舍中处于家庭冷却的成人参与安排，其余宿舍居民及训练室所有居民保留。儿童、外出或已倒下的居民不调动。&#10;&#10;只比较力、感、耐、魅、智、敏六项基础属性。唯一最高者先安排，并列最高者补空位或替换低属性居民；同类房间优先高等级、大容量。智力优先零件工坊，再安排医务室，魅力安排电台。&#10;&#10;剩余居民进入最高属性对应的训练室；最高属性已达 10 时，选择其他有空位且对应属性未满的训练室（包含幸运）。无合适训练空位时补生产空位，资源缺口优先、基础属性匹配其次，导致废料亏损的工坊最后补；生产房全满才移到门外。排除升级、施工及停产房间。&#10;&#10;按最高属性优先分配，不保障资源收支。完成后显示预计净产出，废料扣除零件工坊消耗；出现亏损时提示手动调整，不自动改派。">?</button></div>
    <div class="action-with-help"><button id="organize" disabled>一键整理房间</button><button class="help-button" type="button" aria-label="房间整理规则" title="默认顺序：生产房 → 训练室、电台、武器/服装工坊 → 宿舍 → 仓库，可在上方调整。先拆成单格，利用至少 1 格空位移动，同类到位后恢复自动合并。有施工、升级、事件或制作时退出；先展示完整规划，确认后执行。">?</button></div>
  </div>
  <p id="status" role="status" aria-live="polite">正在连接页面…</p>
  <p id="rates" hidden></p>
  <ul id="rooms"></ul>
  <section id="room-confirmation" hidden>
    <p class="note">请核对上方规划。确认后开始拆分、移动和合并，中途停止不会自动撤销，可能保留已拆分的单格房间；取消不改变房间。</p>
    <div class="actions">
      <button id="confirm-rooms">确认执行</button>
      <button id="cancel-rooms">取消整理</button>
    </div>
  </section>
  <details id="excluded" hidden>
    <summary id="excluded-count"></summary>
    <ul id="excluded-list"></ul>
  </details>
  <script src="room-planner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
