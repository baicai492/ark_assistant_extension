<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>一键托管</title><link rel="stylesheet" href="../module.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>一键托管<button class="help-button" type="button" aria-label="一键托管说明" title="每轮按顺序刷新避难所数据、全部收取、事件处理、新人改名、资源补缺、造神计划、自动生育、装备分配、废土检查。&#10;&#10;资源补缺：电力、食物、净水出现负收益时，从非缺口岗位调人补进空位：优先废料回收站，其次医务室、电台，零件工坊最后；同一产品优先等级高的房间，已有居民在低等级房间而高等级有空位时会迁上去（外出居民的岗位仍占容量）；训练室居民不参与，原岗位资源不会因此转负。没有缺口且零件工坊、废料回收站、医务室、电台都满员时，空闲居民会补进电力、食物、净水还有空位的房间。自动生育把居民拉去宿舍后若出现负收益，等待期间每 30 秒检查并立即补人。&#10;&#10;装备分配：按居民所在房间需要的属性自动穿戴加成最高的服装；仓库以及宿舍、门外居民身上的服装会重新分配，外出或倒下居民身上的不转交。&#10;&#10;事件救援默认不勾选，勾选后可展开，默认选择专人专救；一键救援次数默认为 3 次。专人专救：变异鼠、掠夺者、深层野兽调用发电站和武器工坊居民，灭火、堵漏调用餐厅居民。专人专救只调用无事件房间中在家存活的成人，按事件房间空位调入。无事件无快照时直接继续；有事件无快照时保存站位并按所选方式救援；有事件有快照时继续后续步骤；无事件有快照时恢复在家存活成人的站位并清除快照。关闭事件救援时暂停救援和归位，已有快照保留到再次启用。&#10;&#10;有电台时检查门外新成人：按最高属性简称及三位编号改名，改名后保持门外，不安排房间。首次开启也检查门外无父母的成人，之后按新增居民识别。&#10;&#10;新人遣散默认不勾选，勾选后可展开，默认选择指定属性，耐力低于 4 则遣散，也可改选总属性条件。仅处理本次开启托管后新出现的电台门外成人，七项基础属性包含幸运；已有居民不遣散。严格低于所选阈值才遣散，等于阈值保留。&#10;&#10;废土只接管已有单人探险，不开启新探险或新的每周任务。事件次数不含初始出发日志，达到阈值后召回；到家领取后先检查居民血量，低于 60% 时使用一次治疗针，再按原居民、区域、出发治疗针数量及深渊设置再次派出（深渊会按游戏规则再次消耗汽水）。无探险时跳过；治疗针不足时等待，其他失败停止并记录原因。&#10;&#10;本周废土任务：小队到家后自动领取，完成的任务不再重试，队员回到训练、生育、工作等正常调度；失败的任务按原班人马重新派出；任务进行中的小队成员不参与其他岗位或生育调动。&#10;&#10;自动周常默认不勾选。勾选后从休息区（门外、在家、成年、血量不低于上限 50%）的闲置居民中取等级最高的 3 人组队（同等级按任务战力；战力＝等级×2＋力量＋耐力＋敏捷＋武器伤害，服装加成计入三项属性），出发前换上对任务战力提升最大的武器和服装（同提升优先等级高的），派往尚未完成的本周任务。游戏同一时间最多允许 2 支任务小队（进行中、返程中都计入），未满 2 支且闲置居民够 3 人时才派出。已完成的任务不再派出，进行中的小队不提前召回；失败的任务优先按原班人马补齐到 3 人后重试。&#10;&#10;关闭扩展面板后继续运行；关闭托管后不再发出新操作，正在提交的请求会完成。托管期间请勿手动调动居民。日志自动保存在扩展本地存储，不限制条数；开启托管后通过本地 host 自动写入插件目录的 logs/shelter.log（首次需双击 tools/install-log-host.cmd 安装一次），也可导出或清空。">?</button></h1>
  <form id="settings">
    <label for="interval">检查间隔（秒）<input id="interval" type="number" min="1" step="1" value="300" required></label>
    <label for="recall-events">废土触发事件后召回（次）<input id="recall-events" type="number" min="1" step="1" value="6" required></label>
    <details id="rescue-section" class="feature">
      <summary><input id="rescue-enabled" type="checkbox" aria-label="启用事件救援"><span>事件救援</span></summary>
      <fieldset id="rescue-options" class="feature-options" aria-label="事件救援方式" disabled>
        <div class="option-row"><label><input id="rescue-mode-auto" type="radio" name="rescue-mode" value="auto">一键救援</label><input id="rescue-count" type="number" aria-label="一键救援次数" min="1" step="1" value="3" required disabled><span>次</span></div>
        <div class="option-row"><label><input id="rescue-mode-workers" type="radio" name="rescue-mode" value="workers" checked>专人专救</label><button class="help-button" type="button" aria-label="专人专救说明" title="变异鼠、掠夺者、深层野兽，调用发电站和武器工坊的人去救援&#10;灭火、堵漏，调用餐厅的人去救援">?</button></div>
      </fieldset>
    </details>
    <details id="dismiss-section" class="feature">
      <summary><input id="dismiss-newcomers-enabled" type="checkbox" aria-label="启用新人遣散"><span>新人遣散</span></summary>
      <fieldset id="dismiss-options" class="feature-options" aria-label="新人遣散条件" disabled>
        <div class="option-row"><label><input id="dismiss-enabled" type="radio" name="dismiss-mode" value="total">总属性低于</label><input id="dismiss-total" type="number" aria-label="总属性遣散阈值" min="1" max="70" step="1" value="20" placeholder="输入阈值" required disabled><span>则遣散</span></div>
        <label><input id="dismiss-stat-enabled" type="radio" name="dismiss-mode" value="stat" checked>指定属性</label>
        <div class="dismiss-stat-rule">
          <select id="dismiss-stat-key" aria-label="遣散判断属性" required disabled>
            <option value="" disabled>选择属性</option>
            <option value="str">力量</option>
            <option value="per">感知</option>
            <option value="end" selected>耐力</option>
            <option value="cha">魅力</option>
            <option value="int">智力</option>
            <option value="agi">敏捷</option>
            <option value="lck">幸运</option>
          </select>
          <span>低于</span><input id="dismiss-stat" type="number" aria-label="指定属性遣散阈值" min="1" max="10" step="1" value="4" placeholder="输入 X" required disabled><span>则遣散</span>
        </div>
        <p class="warning">遣散后无法找回。</p>
      </fieldset>
    </details>
    <details id="god-section" class="feature">
      <summary><input id="god-enabled" type="checkbox" aria-label="启用造神计划"><span>造神计划</span><button class="help-button" type="button" aria-label="造神计划说明" title="每轮先检查电力、食物、净水：出现负收益时从废料回收站、零件工坊等非缺口岗位调人补进空位，原岗位资源不能因此转负；训练抽人也不会让这三项转负。&#10;&#10;优先训练未满 70 的居民：按七项基础属性总和从高到低，把在岗居民补进有空位的训练室；门外新人不自动安排。&#10;&#10;训练中的居民练满当前属性后：总和未满 70 的转练下一个最高的未满属性；总和已满 70 的转生产岗位。岗位先补电力、食物、净水缺口，三项都是正收益时优先零件工坊（保证废料不为负），再废料回收站、医务室，最后电台；这些岗位都满员时补进电力、食物、净水还有空位的房间，全部满员才留在训练室等待。&#10;&#10;名字含 ★ 的居民为造神亲本：练满当前属性后按其余未满属性从高到低寻找训练室，没有空位则去休息。&#10;&#10;居民调动完成后自动穿戴装备：按所在房间需要的属性分配加成最高的服装，仓库和宿舍、门外居民身上的服装会重新分配，外出居民身上的不转交。&#10;&#10;勾选后读取亲本当前基础属性及本级训练进度，之后随托管循环更新；下一站按当前空位预估。存在事件或救援站位快照时暂停造神调动和换装，归位完成后继续。">?</button></summary>
      <section class="feature-options" aria-label="造神亲本训练情况">
        <p id="god-status" class="hint" role="status">勾选后读取造神亲本训练情况。</p>
        <ul id="god-parents" aria-label="造神亲本训练进度"></ul>
      </section>
    </details>
    <details id="birth-section" class="feature">
      <summary><input id="birth-enabled" type="checkbox" aria-label="启用自动生育"><span>自动生育</span><button class="help-button" type="button" aria-label="自动生育说明" title="只挑七项基础属性全为 10、可配对（成年、在家、心情 ≥50、不在家庭冷却、无亲属关系）的居民，每间宿舍最多同时安排两组（6 人宿舍两组），已有感情关系计入组数；感情每 10 分钟由服务端结算。配对、父母回岗、成年子代、资源补缺和装备在托管等待期间每 30 秒检查一次，不必等完整检查间隔。&#10;&#10;待产父母留在生育宿舍等孩子出生，孩子出生后立即回到生产岗位并穿戴对应装备；服务端短暂把刚配对的两人移出宿舍或换房时，扩展会保留配对记录并按现状恢复，不会每 30 秒反复搬进搬出，超过宽限期仍未同房则暂停这对配对并冷却一段时间；岗位先补电力、食物、净水缺口，三项都是正收益时优先零件工坊（保证废料不为负），再废料回收站、医务室，最后电台；这些岗位都满员时补进电力、食物、净水还有空位的房间。&#10;&#10;配对把居民拉去宿舍后若出现电力、食物、净水负收益，立即从其他岗位补人：优先废料回收站，其次医务室、电台，零件工坊最后。&#10;&#10;子代成年后立即检查（托管等待期间每 30 秒一次，不必等完整检查间隔；刷新面板后按“父母仍在避难所”识别，不依赖内存记录）：属性总和未满 70 的优先训练，按总和从高到低排队，先练最高的未满属性；没有训练空位时先去生产岗位，等训练空位出现再转回训练；练满 70 后安排生产岗位，岗位顺序与上面一致。&#10;&#10;宿舍只留给生育流程：人口已满时不再新增配对；感情已经 100% 的配对由游戏保持在宿舍等待人口空位，扩展不再反复调动（调出会被服务端放回，反而造成来回切换）；其余配对和未配对居民撤出。人口未满时只保留全 10 的居民，非全 10（包括家庭冷却中的）一律调出宿舍，全 10 但暂时没配上对的先回生产岗位、下一轮再拉回宿舍配对；调出时有生产空位就去岗位，没有空位直接去门外休息区，不留在宿舍被服务端自动配对。&#10;&#10;人口上限按游戏公式（存活居民＋待产，已建成宿舍宽度 ×(2+2×等级)，最高 200）为已有配对预留出生名额，所有已经建立感情的配对（包括冷却中、心情不足或房间出事的）都计入预留，名额不足时不再新增配对，避免新配对感情满后卡在等待空位；人口上限增加或腾出空位后会自动待产。">?</button></summary>
      <section class="feature-options" aria-label="自动生育设置">
        <p class="note">自动生育的子代不会再次被拉回宿舍配对，成年后优先训练或上岗。</p>
      </section>
    </details>
    <details id="quest-section" class="feature">
      <summary><input id="quest-enabled" type="checkbox" aria-label="启用自动周常"><span>自动周常</span><button class="help-button" type="button" aria-label="自动周常说明" title="每轮检查本周废土任务，只从休息区（门外、在家、成年、血量不低于上限 50%）的闲置居民中取等级最高的 3 人组队（同等级按任务战力）；战力＝等级×2＋力量＋耐力＋敏捷＋武器伤害（服装加成计入三项属性），空闲不足 3 人不出发。出发前自动换上对任务战力提升最大的武器和服装（同提升优先等级高的），不会把现有装备换成更弱的。&#10;&#10;游戏同一时间最多允许 2 支任务小队（进行中、返程中都计入），达到上限后等有队伍回来再派；有多组 3 人时按这个上限同时派出。已完成的任务不再派出，不再重复做；正在进行的任务小队不会提前召回。事件处理或救援站位未归位时暂停派出新队伍。&#10;&#10;任务小队到家后自动领取：成功的任务就此结束，队员恢复正常调度；失败的任务优先按原班人马补齐到 3 人后重新派出，原班人马血量不足时用休息区闲置居民补位。正在任务中、等待再次派出的探险归来者、电台待改名新人和感情已满等待生育空位的配对不会编入任务队。">?</button></summary>
      <section class="feature-options" aria-label="自动周常设置">
        <p class="note">任务进行中的小队成员不参与岗位和生育调动，领取后才回到正常调度。</p>
      </section>
    </details>
    <div class="actions"><button id="toggle" disabled>开启</button></div>
  </form>
  <p id="status" role="status" aria-live="polite">正在连接页面…</p>
  <p class="warning">刷新或关闭游戏网页会停止托管，日志保留。</p>
  <div class="log-head"><label for="logs">运行日志</label><span class="log-actions"><button id="clear-logs" class="log-export" type="button">清空日志</button><button id="export-logs" class="log-export" type="button">导出日志</button></span></div>
  <textarea id="logs" readonly aria-label="托管运行日志" placeholder="开启后记录事件、新居民和废土处理结果"></textarea>
  <p id="log-file" class="hint" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
